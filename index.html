<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="scores">
        <span>Your Score: <span id="userScore">0</span></span>

        <span>Computer Score: <span id="compScore">0</span></span>
    </p>

    <h1>Rock Paper Scissor</h1>

    <div class="buttons">
        <button id="rock">&#x1f44a</button>
        <button id="paper">&#x1f590</button>
        <button id="scissor">&#x270c</button>
    </div>

    <h1 id="result">Result...</h1>

    <p id="restart">Restart</p>

    <script src="index.js"></script>
</body>
</html>
